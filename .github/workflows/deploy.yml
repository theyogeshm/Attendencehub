# ── DTU Hub — GitHub Pages + Vercel Deploy ─────────────────────────────────
# Triggered on every push to main.
# Builds the Vite app with production env vars from GitHub Secrets,
# deploys the dist/ folder to the gh-pages branch (GitHub Pages),
# AND triggers a Vercel production deployment if VERCEL_TOKEN is set.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   VITE_SUPABASE_URL      — your Supabase project URL
#   VITE_SUPABASE_ANON_KEY — your Supabase anon/public key
#   VITE_ADMIN_EMAIL       — admin Google account email
#   VITE_APP_URL           — https://www.attendancehub.me
#
# Optional (for Vercel deployment — get from Vercel dashboard):
#   VERCEL_TOKEN           — Vercel personal access token
#   VERCEL_ORG_ID          — Vercel team/org ID (from .vercel/project.json)
#   VERCEL_PROJECT_ID      — Vercel project ID (from .vercel/project.json)

name: Deploy to GitHub Pages + Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: write  # needed to push to gh-pages branch

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build — inject secrets/vars as env vars (never stored in code)
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets['VITE_SUPABASE_URL'] || vars['VITE_SUPABASE_URL'] }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets['VITE_SUPABASE_ANON_KEY'] || vars['VITE_SUPABASE_ANON_KEY'] }}
          VITE_ADMIN_EMAIL: ${{ secrets['VITE_ADMIN_EMAIL'] || vars['VITE_ADMIN_EMAIL'] }}
          VITE_APP_URL: ${{ secrets['VITE_APP_URL'] || vars['VITE_APP_URL'] }}
        run: npm run build

      # 5. Deploy dist/ to gh-pages branch (GitHub Pages)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true    # keep gh-pages branch clean (no history bloat)

      # 6. Deploy to Vercel (production) — only runs if VERCEL_TOKEN secret is set
      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./
